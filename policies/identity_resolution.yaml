      - Bill of Quantities
      - Schedule of Rates
      fields:
      - boq_number
      - revision
      - currency
      - priced_item_references
      notes: Line-item quantity/rate/amount belongs to BOQ item assertion, not physical equipment price.
    PriceSchedule:
      labels:
