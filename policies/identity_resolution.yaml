      parent_exclude: [EngineeringPackage, Subsystem]
      allow_unspecified_parent_subtype: true
      allow_unspecified_child_subtype: true
    hasSubsystem: *has_subsystem_subtypes
    has equipment: &has_equipment_subtypes
