  enable_exact_identifier_route: true
  enable_lexical_route: true
  enable_vector_route: true
  enable_verified_graph_expansion: true
validation:
  require_relation_evidence: true
  table_association_validation: true
  require_quotation_in_source: true
  reject_page_label_relation_endpoints: true
  require_source_evidence_for_hierarchy: true
  reject_duplicate_entity_surfaces: true
  prevent_fake_intermediate_nodes: true
  # Creation-time + finalize path: verbatim quotes required; offsets filled in Python.
  require_verbatim_evidence_quotes: true
  reject_untyped_or_empty_primary_labels: true
# When LLM relation evidence quotes only one endpoint, recover the shortest
# contiguous source span that contains both endpoints (no invented text).
# Hierarchy/membership nearby recovery also requires YAML membership markers,
# section ownership, and table context — co-occurrence alone is not enough.
claim_evidence_recovery:
  nearby_span_max_chars: 900
  require_membership_evidence: true
  require_section_ownership: true
  require_table_context: true
  # Identifier-shaped objects (YAML identifier_patterns / engineering tags)
  # still need a table row. Named list/heading members do not.
  require_table_context_for_identifier_objects: true
  reuse_section_membership_markers: true
  # Evidence-first: LLM must emit a verbatim quote; Python verifies absolute
  # offsets on the full Markdown. Missing quotes may use source-backed recovery
  # only — never invent evidence or auto-confirm graph eligibility.
  require_creation_evidence: true
  # Confirmed edges need subject + predicate meaning + object/value in the quote.
  # Co-mention of endpoints alone is not enough.
  require_predicate_meaning: true
  require_claim_direction: true
  # Reject truncated modal/action fragments wrongly extracted as attribute values.
  reject_incomplete_attribute_action_phrases: true
  incomplete_attribute_action_cues:
  - shall
  - will
  - must
  - should
  - may
  - carry out
  - carried out
  - to be
  - to perform
  - to provide
  - to ensure
# Generic semantic relation recovery (source-grounded). Contracts are YAML-owned:
# no company/tag/document names and no hierarchy/subtype gate relaxation.
semantic_relation_recovery:
  enabled: true
  sync_quarantine_after_recovery: true
  max_repairs_per_doc: 200
  max_candidates_per_doc: 80
  prefer_local_windows: true
  # Candidate pairs must share a tight cue-centered window (not whole sections).
  candidate_max_window_chars: 420
  candidate_cue_context_chars: 180
  # Document-scoped evidence windows — avoid repeated full-doc scans per claim.
  evidence_index:
    enabled: true
    windows:
    - sentence
    - table_row
    - section_block
    table_row_max_chars: 800
    section_block_max_chars: 1200
    sentence_max_chars: 600
