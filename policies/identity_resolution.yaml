    DocumentSection:
      labels:
      - Section
      - Appendix
      - Annexure
      - Master Index
      fields:
      - section_id
      - section_title
      - section_path
      notes: Only create node for structurally meaningful source section.
  relationship_groups:
    # Physical / scope engineering chain (not document nesting).
    engineering_hierarchy:
    - predicate: hasScope
      parent: Tender
      child: ScopeOfWork
      parent_primary: ProcurementArtifact
      child_primary: Document
    - predicate: hasPackage
      parent: ScopeOfWork
      child: EngineeringPackage
      parent_primary: Document
      child_primary: System
    - predicate: hasEquipment
      parent: ScopeOfWork
      child: Equipment
      parent_primary: Document
      child_primary: Equipment
      note: standalone equipment only when explicitly in scope
    - predicate: hasSystem
      parent: EngineeringPackage
      child: System
      parent_primary: System
      child_primary: System
    - predicate: hasEquipment
      parent: EngineeringPackage
      child: Equipment
      parent_primary: System
      child_primary: Equipment
      note: package-direct equipment
    - predicate: hasSubsystem
      parent: System
      child: Subsystem
      parent_primary: System
      child_primary: System
    - predicate: hasEquipment
      parent: System
      child: Equipment
      parent_primary: System
      child_primary: Equipment
    - predicate: hasEquipment
      parent: Subsystem
      child: Equipment
      parent_primary: System
      child_primary: Equipment
    - predicate: hasComponent
      parent: Equipment
      child: Component
      parent_primary: Equipment
      child_primary: Component
    # Document nesting / attachments only (never physical containment).
    document_hierarchy:
    - predicate: hasDocument
      parent: Tender
      child: Document
      parent_primary: ProcurementArtifact
      child_primary: Document
      note: NIT/ITB/BDS/GCC/SCC/BOQ/Specifications/PID/Datasheets/QAP/ITP/Addenda
    - predicate: documentContains
      parent: Document
      child: Document
      parent_primary: Document
      child_primary: Document
    - predicate: sectionContains
      parent: Document
      child: Document
      parent_primary: Document
      child_primary: Document
      note: child must be DocumentSection or identified contained document
    # Legacy alias key — same edges as engineering_hierarchy (kept for older dumps).
    tender_scope_hierarchy:
    - predicate: hasScope
      parent: Tender
      child: ScopeOfWork
    - predicate: hasPackage
      parent: ScopeOfWork
      child: EngineeringPackage
    - predicate: hasEquipment
      parent: ScopeOfWork
      child: Equipment
    - predicate: hasSystem
      parent: EngineeringPackage
      child: System
    - predicate: hasEquipment
      parent: EngineeringPackage
      child: Equipment
    - predicate: hasSubsystem
      parent: System
      child: Subsystem
    - predicate: hasEquipment
      parent: System
      child: Equipment
    - predicate: hasEquipment
      parent: Subsystem
      child: Equipment
    - predicate: hasComponent
      parent: Equipment
      child: Component
    deliverables_and_work:
    - predicate: requiresActivity
      parent: ScopeOfWork
      child: Activity
    - predicate: requiresDeliverable
      parent: EngineeringPackage
      child: Document
    - predicate: hasRequirement
      parent: ScopeOfWork
      child: Requirement
    cross_references:
    - predicate: issuedBy
      subject: Tender
      object: Organization
    - predicate: forProject
      subject: Tender
      object: Project
    - predicate: coversScope
      subject: Project
      object: ScopeOfWork
    - predicate: specifies
      subject: Document
      object: EngineeringPackage|System|Equipment|Component|Requirement
    - predicate: describes
      subject: Document
      object: System|Equipment|Component|PipingLine|ControlLoop
    - predicate: lists
      subject: Document
      object: EngineeringPackage|Equipment|Component|Material
    - predicate: definesInspectionFor
      subject: Document
      object: EngineeringPackage|Equipment|Component
    - predicate: references
      subject: Document
      object: Document|Standard|Requirement
    - predicate: appliesTo
      subject: Requirement|Standard
      object: EngineeringPackage|System|Equipment|Component
    - predicate: hasConnectionPoint
      subject: Equipment
      object: ConnectionPoint
    - predicate: associatedWith
      subject: System
      object: PipingLine|ControlLoop|ProcessStream
    - predicate: handles
      subject: System
      object: Material
    - predicate: installedAt
      subject: Equipment
      object: Facility
    - predicate: connectedTo
      subject: Equipment|PipingLine|ConnectionPoint
      object: Equipment|PipingLine|ConnectionPoint
  relation_validation:
    validate_primary_and_subtype: true
    require_source_evidence: true
    preserve_edge_kind: true
    reject_unverified_membership_from_heading_only: true
    never_invent_intermediate_nodes: true
    reject_fake_intermediate_nodes: true
    allow_missing_scope_package_system_levels: true
    preserve_package_direct_vs_system_equipment_edges: true
    prevent_same_tag_cross_namespace_merge: true
    do_not_infer_identity_from_parent_alone: true
    allow_multiple_document_references_to_same_entity: true
    document_edges_are_not_physical_containment: true
    engineering_edges_are_not_document_nesting: true
    tender_scope_edges_are_not_physical_containment: true
    do_not_infer_compliance_as_verified_from_requirement: true
    unmatched_entities_go_to_review_not_forced_hierarchy: true
    separate_engineering_and_document_hierarchies: true
  example_assertions:
  - subject: Tender NIT-001
    predicate: hasDocument
    object: Bid Data Sheet BDS-001
    edge_kind: document_hierarchy
  - subject: Tender NIT-001
    predicate: hasScope
    object: Pump Supply Scope
    edge_kind: engineering_hierarchy
  - subject: Pump Supply Scope
    predicate: hasPackage
    object: Pump Package PKG-01
    edge_kind: engineering_hierarchy
  - subject: Pump Package PKG-01
    predicate: hasSystem
    object: Cooling Water System
    edge_kind: engineering_hierarchy
  - subject: Cooling Water System
    predicate: hasEquipment
    object: Pump P-101
    edge_kind: engineering_hierarchy
  - subject: Pump P-101
    predicate: hasComponent
    object: Mechanical Seal
    edge_kind: engineering_hierarchy
  - subject: Equipment Datasheet DS-101
    predicate: specifies
    object: Pump P-101
    edge_kind: cross_reference
