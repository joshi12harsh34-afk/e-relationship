# Semantica policy + NER taxonomy — updated from uploaded v3.4 to v3.5
# Main graph: Tender -> ScopeOfWork -> EngineeringPackage -> System -> [Subsystem] -> Equipment -> Component
# Separate branch: Tender -> NIT/ITB/BDS/GCC/SCC/BOQ/Specifications/P&ID/Datasheets/QAP/ITP/Addenda
# Source-grounded named referents become entities; scalar values remain properties.
# Graph-schema additions are proposed config; application validators must be updated to use them.
# Legacy identity-resolution settings are retained except unsafe Milestone normalization.

version: '3.6'
ner_taxonomy:
  schema_name: Semantica Unified Domain-Agnostic NER Taxonomy
  version: 1.2.0
  purpose: 'Broad document NER with petroleum/P&ID engineering support and non-overlapping primary entity

    labels.'
  primary_type_count: 28
  # Compact ontology injection for chunked / large-document NER (ontology_hints compact=True).
  # Contract: LLM predicts primary + subtype + predicates from these hints;
  # Python validates against hierarchy/subtype gates + source evidence (no force-relabel).
  # Disambiguation order for compact prompts: set compact_priority on rules in
  # disambiguation_rules (lower = earlier). Do not maintain a separate pair list here.
  compact_prompt:
    priority_subtypes:
      Document:
      - ScopeOfWork
      - Datasheet
      - Specification
      - DocumentSection
      - BidDataSheet
      - Drawing
    pins:
    - 'Document typing: PRO-TDS/TDS/datasheet → Datasheet or Specification with specifies/describes
      (not DocumentSection; not hasPackage). SOW → ScopeOfWork may hasPackage EngineeringPackage.'
    - 'PK tags (middle segment PK, e.g. 22-PK-3801): primary System + subtype EngineeringPackage.
      Never label a bare PK tag as Equipment. Emit one canonical System per PK tag.'
  entity_types:
  - type: Person
    group: actors_and_places
    definition: An identifiable individual human.
    positive_examples:
    - Jane Smith
    - Dr. A. Kumar
    exclusions_common_confusions: Job title alone or an organization
    extraction_guidelines: Use for a named or uniquely identified person.
  - type: Organization
    group: actors_and_places
    definition: 'An identifiable collective legal, institutional, or organizational actor, including departments

      and government agencies.'
    positive_examples:
    - Acme Industrial Corp.
    - Procurement Department
    exclusions_common_confusions: Facility, project, or team role alone
    extraction_guidelines: 'Use parent_organization relationships and an organizational_unit subtype for

      departments.'
  - type: Role
    group: actors_and_places
    definition: 'A specifically named organizational or operational position with an identifiable holder

      or responsibility.'
    positive_examples:
    - Lead Mechanical Engineer
    - Site Safety Officer
    exclusions_common_confusions: Person, work activity, standalone generic job title
    extraction_guidelines: Extract only when attached to a specific holder, assignment or reference.
  - type: GeographicLocation
    group: actors_and_places
    definition: A named geographic place, region or address, independent of its industrial function.
    positive_examples:
    - Houston, Texas
    - Western Region
    exclusions_common_confusions: Refinery complex or processing plant
    extraction_guidelines: Store coordinates or address as properties; site assets are Facility.
  - type: Facility
    group: actors_and_places
    definition: An identifiable physical site, building, industrial complex, or operational area.
    positive_examples:
    - Coastal Refinery Complex
    - Unit 3 Process Area
    - Tank Farm A
    exclusions_common_confusions: Operating company, expansion project, processing equipment
    extraction_guidelines: For nested site areas use Facility with subtype SiteArea and partOf relation.
  - type: Project
    group: actors_and_places
    definition: A bounded initiative or programme with objectives, scope and lifecycle.
    positive_examples:
    - Plant Expansion Project
    - EPCM Phase 2
    exclusions_common_confusions: Physical facility, recurring process, one-off task
    extraction_guidelines: Project codes belong to the project when context confirms it.
  - type: Document
    group: information_and_governance
    definition: 'An identifiable recorded information artifact, including its formally identified sections,

      drawings, reports and reference works.'
    positive_examples:
    - Document Index
    - P&ID drawing D-1001
    - Bill of Quantities
    - published journal paper
    exclusions_common_confusions: 'Equipment, the work described by the document, unidentifiable formatting

      header'
    extraction_guidelines: 'Use subtype DocumentSection, Drawing, Report, Specification, Datasheet,

      Publication, ProcedureDocument, or ScopeOfWork when useful. PRO-TDS/TDS/datasheet numbers →

      Datasheet or Specification; SOW titles → ScopeOfWork; bare annexure/section headings →

      DocumentSection.'
  - type: Requirement
    group: information_and_governance
    definition: 'An individually identifiable condition, obligation, constraint or acceptance criterion

      that must be met.'
    positive_examples:
    - REQ-210
    - Clause 4.3 pressure test acceptance requirement
    exclusions_common_confusions: Entire specification document, observed property value
    extraction_guidelines: Capture source document and verification criteria as properties/relations.
  - type: LegalInstrument
    group: information_and_governance
    definition: A formally identifiable legal rule, case, agreement or rights instrument.
    positive_examples:
    - Contract CT-1001
    - Environmental Protection Act
    - Patent US123456
    exclusions_common_confusions: Procurement request, project, equipment
    extraction_guidelines: 'Set subtype Contract, Regulation, LegalCase, or IntellectualProperty; never

      conflate a contract with its project.'
  - type: ProcurementArtifact
    group: information_and_governance
    definition: A distinct purchasing/solicitation or purchasing-record artifact or transaction.
    positive_examples:
    - Tender NIT-001
    - RFQ-203
    - Purchase Order PO-100
    - Invoice INV-10
    exclusions_common_confusions: Signed contract, generic tendering method, generic Document heading
    extraction_guidelines: 'Use subtype Tender, RFQ, PurchaseOrder, Invoice, Transaction; prefer Document

      for an attachment not representing procurement activity.'
  - type: Standard
    group: information_and_governance
    definition: An identifiable normative standard or formally published code.
    positive_examples:
    - API 610
    - ISO 15926
    - ISA-5.1
    exclusions_common_confusions: Internal specification, legislation
    extraction_guidelines: Include edition and issuing body when explicit.
  - type: FinancialInstrument
    group: information_and_governance
    definition: An identifiable security, debt obligation, or structured financial asset.
    positive_examples:
    - Corporate Bond Series A
    - Loan Facility LF-01
    exclusions_common_confusions: Payment, price amount, ordinary contract
    extraction_guidelines: Record issuer, maturity and amount as attributes.
  - type: DigitalResource
    group: information_and_governance
    definition: An identifiable dataset, database, software application, model, or digital repository.
    positive_examples:
    - Process Simulation App
    - Equipment Register Database
    - Simulation Model M-01
    exclusions_common_confusions: Physical instrument, unreferenced file format
    extraction_guidelines: Use subtype Software, Dataset, Database, SimulationModel, Repository.
  - type: Equipment
    group: physical_and_engineering
    definition: 'A separately identifiable operational physical asset, machine, vessel or device with an

      equipment function.'
    positive_examples:
    - Centrifugal Pump P-101
    - Compressor K-202
    - Heat Exchanger E-101
    exclusions_common_confusions: Its impeller or nozzle, the entire facility, instrument loop
    extraction_guidelines: Use equipment subtype (Pump, Compressor etc.) and stable tag identifiers.
  - type: Component
    group: physical_and_engineering
    definition: 'An identifiable physical part, fitting, sensor, instrument or constituent of a larger

      assembly, including piping and instrument items.'
    positive_examples:
    - Valve XV-101
    - Transmitter PT-101
    - impeller
    - Reducer R-02
    - Flange FL-01
    exclusions_common_confusions: Complete packaged system, piping line, scalar property
    extraction_guidelines: 'Use subtype PipingComponent, Instrument, MechanicalPart or ElectricalComponent;

      refer to parent asset via partOf.'
  - type: System
    group: physical_and_engineering
    definition: 'An identifiable functional arrangement of connected assets/components acting together;

      includes identified subsystems and equipment packages.'
    positive_examples:
    - Cooling Water System
    - Seal Oil Subsystem
    - Solids Handling Package
    exclusions_common_confusions: Individual pump, geographical area, project, one-off task
    extraction_guidelines: Use subtype Subsystem or Package and explicit partOf/contains relations.
  - type: PipingLine
    group: physical_and_engineering
    definition: 'A separately identifiable physical pipe run, line or line segment, usually with a line

      designation.'
    positive_examples:
    - Line 10-P-101
    - 6-inch line L-204
    exclusions_common_confusions: Fluid stream, piping fitting, pipeline region/network
    extraction_guidelines: Extract line tag; size/service/rating are properties.
  - type: ProcessStream
    group: physical_and_engineering
    definition: An identifiable flow of material or energy between process points.
    positive_examples:
    - Feed Stream S-01
    - Cooling Water Return Stream
    exclusions_common_confusions: Physical pipe line or bulk material at rest
    extraction_guidelines: Relate source/destination and medium; flow rate as property.
  - type: ConnectionPoint
    group: physical_and_engineering
    definition: An identifiable port, nozzle, tie-in or named connection/interface.
    positive_examples:
    - Nozzle N1
    - Tie-in TP-204
    exclusions_common_confusions: Whole equipment or line, unspecified connection
    extraction_guidelines: Store endpoint and orientation when explicit.
  - type: Material
    group: physical_and_engineering
    definition: An identifiable chemical, substance, material grade, consumable or bulk product.
    positive_examples:
    - SS316L
    - crude oil
    - polymer pellets
    - Catalyst C-10
    exclusions_common_confusions: Quantity, flow stream, separately manufactured equipment item
    extraction_guidelines: Use subtype Chemical, MaterialGrade, Consumable, ProductMaterial as appropriate.
  - type: Product
    group: physical_and_engineering
    definition: 'An identifiable marketed/manufactured product or model separate from a specific installed

      asset.'
    positive_examples:
    - Pump Model X200
    - Brand Product A
    exclusions_common_confusions: Installed equipment instance, material grade, procurement record
    extraction_guidelines: Link actual instance to product model; capture model/brand properties.
  - type: ControlLoop
    group: physical_and_engineering
    definition: 'An identifiable functional instrumentation/control loop composed of one or more devices

      and signals.'
    positive_examples:
    - FIC-101 control loop
    - TIC-201 temperature loop
    exclusions_common_confusions: Single transmitter PT-101, control panel as hardware
    extraction_guidelines: Link participating Components; store controlled variable and setpoint as properties.
  - type: Process
    group: time_action_and_knowledge
    definition: An identifiable repeatable physical, chemical, administrative or computational transformation/workflow.
    positive_examples:
    - Crude Distillation
    - Polymerization
    - Purchase Approval Workflow
    exclusions_common_confusions: Equipment or single specific execution
    extraction_guidelines: 'Use for process definition or sustained operational process; distinguish actual

      execution as Activity.'
  - type: Activity
    group: time_action_and_knowledge
    definition: A specifically identifiable task or execution of work, not a project or physical object.
    positive_examples:
    - Hydrotest Task HT-12
    - Inspection Work Order WO-10
    exclusions_common_confusions: Project, document index, equipment item
    extraction_guidelines: Prefer a task/work-order identifier or explicit bounded action evidence.
  - type: Event
    group: time_action_and_knowledge
    definition: An identifiable occurrence anchored to time, including incidents, meetings and failures.
    positive_examples:
    - Planned shutdown event
    - Failure Event FE-12
    - Annual technical conference
    exclusions_common_confusions: Repeatable procedure or ongoing process
    extraction_guidelines: Capture time, participants and affected assets as attributes or relations.
  - type: Condition
    group: time_action_and_knowledge
    definition: An independently referenced disease, fault, state or operational/environmental condition.
    positive_examples:
    - Corrosion Damage CD-01
    - Hypertension
    - Pump Cavitation
    exclusions_common_confusions: Pressure reading, qualitative adjective on its own, failure event
    extraction_guidelines: Keep observed scalar values as properties; use subtype Disease, Fault, State.
  - type: ScientificConcept
    group: time_action_and_knowledge
    definition: An identifiable formal scientific/technical theory, method, model or named abstract concept.
    positive_examples:
    - Bernoulli principle
    - Reynolds number
    - finite element method
    exclusions_common_confusions: Measured Reynolds value, unspecified common noun
    extraction_guidelines: Use for formally named or independently discussed concepts, not generic nouns.
  - type: Other
    group: controlled_exception
    definition: 'A clearly identifiable, independently referenceable real-world or document-domain object

      that is supported by the source but genuinely does not fit any of the 27 specific primary types, even

      with an appropriate subtype. Other is the 28th primary — never leave label empty.'
    positive_examples:
    - A uniquely named source object that fits none of the defined specific primary types
    exclusions_common_confusions: 'Not a dumping ground for Project, Document, Organization, Equipment,

      Component, Material, System, or any other specific primary. Exclude generic nouns, noise, attribute

      values, codes that merely identify another entity, incomplete fragments, and candidates that are not

      independently identifiable.'
    extraction_guidelines: 'Use only after checking every specific primary and their subtypes. Require an

      identifiable referent and verbatim evidence. Put justification in metadata.typing_reason and set

      metadata.review_required=true. Never emit empty/null/Unknown/Entity. If the span is not an identifiable

      entity, omit it entirely — do not invent Other for uncertainty alone.'
  recommended_subtypes:
    Organization:
    - Company
    - GovernmentAgency
    - Department
    - University
    - HospitalOrganization
    Facility:
    - Refinery
    - IndustrialComplex
    - SiteArea
    - Building
    - HospitalFacility
    - Plant
    Document:
    # Priority subtypes first so compact large-doc prompts still include them.
    - ScopeOfWork
    - Datasheet
    - Specification
    - DocumentSection
    - BidDataSheet
    - Drawing
    - Section
    - PAndID
    - PFD
    - ProcedureDocument
    - Report
    - Publication
    - BOQ
    - TenderNotice
    - InvitationForBids
    - BidInstructions
    - ContractConditions
    - SpecialConditions
    - TechnicalConditions
    - ScheduleOfRequirements
    - PriceSchedule
    - Datasheet
    - QualityPlan
    - InspectionTestPlan
    - DocumentRegister
    - Addendum
    - TenderSummary
    - QualificationCriteria
    - GeneralArrangementDrawing
    - LineList
    - Manual
    - SparePartsList
    - MaterialRequisition
    - DeliverableRegister
    LegalInstrument:
    - Contract
    - Regulation
    - LegalCase
    - Patent
    - Trademark
    ProcurementArtifact:
    - Tender
    - RFQ
    - NIT
    - PurchaseOrder
    - Invoice
    - Transaction
    - InvitationToBid
    DigitalResource:
    - Software
    - Dataset
    - Database
    - Repository
    - SimulationModel
    Equipment:
    - Pump
    - CentrifugalPump
    - Compressor
    - HeatExchanger
    - Separator
    - StorageTank
    - Reactor
    - PressureVessel
    - Filter
    Component:
    - Instrument
    - PressureTransmitter
    - Valve
    - ControlValve
    - PipingComponent
    - Impeller
    - MechanicalSeal
    - Reducer
    - Flange
    System:
    - Subsystem
    - EngineeringPackage
    - CoolingWaterSystem
    - FlareSystem
    - PneumaticConveyingSystem
    Material:
    - Chemical
    - MaterialGrade
    - Consumable
    - Catalyst
    - Polymer
    Condition:
    - Disease
    - Fault
    - Damage
    - OperationalState
  disambiguation_rules:
  - between:
    - Organization
    - Facility
    rule: 'Actor/legal organization versus physical operating site. A company name is Organization; a plant

      or site is Facility.'
  - between:
    - Project
    - Activity
    - Process
    rule: 'A scoped initiative is Project; a bounded task/execution is Activity; a repeatable workflow/transformation

      is Process.'
  - between:
    - Document
    - Activity
    rule: 'A drawing, index or heading is an information artifact/section, never an Activity based on word

      overlap.'
  # compact_priority: lower numbers surface first in compact/large-doc ontology hints.
  - between:
    - Document
    - System
    compact_priority: 1
    rule: 'PRO-TDS/TDS/datasheet docs use Datasheet or Specification with specifies/describes (never
      hasPackage, never DocumentSection); SOW is ScopeOfWork and may hasPackage an EngineeringPackage;
      bare annexure/section headings alone are DocumentSection, not a Package.'
  - between:
    - Facility
    - System
    rule: Physical place/complex is Facility; functional arrangement of interconnected assets is System.
  - between:
    - Equipment
    - Component
    compact_priority: 4
    rule: 'Independently managed operational machinery is Equipment; instrument, valve and fitting as constituent

      is Component. Model exceptions via asset-role evidence.'
  - between:
    - System
    - Equipment
    compact_priority: 3
    rule: 'Multiple connected pieces acting together form System; a single separately identified machine

      is Equipment.'
  - between:
    - System
    - Project
    rule: 'System is an operational functional arrangement; project is time-bounded work delivering or

      modifying it.'
  - between:
    - PipingLine
    - ProcessStream
    rule: Pipe run is the physical conduit; process stream is the fluid/energy flow in it.
  - between:
    - Material
    - Product
    rule: Substance or grade is Material; catalogued manufactured product/model is Product.
  - between:
    - ProcurementArtifact
    - LegalInstrument
    rule: Tender/PO/invoice is ProcurementArtifact; signed agreement or legal rule is LegalInstrument.
  - between:
    - Document
    - Requirement
    rule: Specification document is Document; an independently stated obligation/criterion is Requirement.
  - between:
    - Document
    - Project
    - System
    rule: Scope of Work is Document (subtype ScopeOfWork) under a Tender via hasScope; it is not a Project or System.
  - between:
    - Component
    - ControlLoop
    rule: Individual PT/valve is Component; coordinated instrument control function is ControlLoop.
  - between:
    - GeographicLocation
    - Facility
    rule: Geographic region/city is GeographicLocation; constructed or operational site is Facility.
  - between:
    - Condition
    - Event
    rule: State/disease/fault as condition is Condition; dated instance of failure/incident is Event.
  - between:
    - Role
    - Person
    rule: Named individual is Person; explicitly referenced position or responsibility is Role.
  - between:
    - Other
    - all_specific_types
    rule: 'Always prefer a specific primary when its definition fits (including via subtype). Other is only

      for a confirmed identifiable entity outside the 27 specific primaries. Uncertainty → omit entity; never

      empty label. Add review flag and typing_reason when Other is used.'
  - between:
    - Equipment
    - Facility
    rule: 'A single managed machine/asset (pump, compressor, vessel) is Equipment. A plant, refinery, tank

      farm or site area is Facility. Do not type a site name as Equipment.'
  - between:
    - Project
    - System
    rule: 'A time-bounded initiative/programme is Project. An operational functional arrangement of assets

      is System (including EngineeringPackage/Subsystem subtypes). Do not type a package or process system as Project.'
  - between:
    - Document
    - LegalInstrument
    rule: 'Drawings, SOW, datasheets, BOQ, indexes and specifications are Document. Signed contracts, acts,

      patents and formal legal agreements are LegalInstrument. A tender solicitation is ProcurementArtifact, not LegalInstrument.'
  - between:
    - ProcurementArtifact
    - Document
    compact_priority: 5
    rule: Tender/RFQ/NIT solicitation is ProcurementArtifact. Independently identified notice or instruction file
      is Document. Never create both for one undifferentiated mention.
  - between:
    - Equipment
    - System
    rule: Package-direct and system-owned equipment are both Equipment, with membership represented by evidence-grounded
      relationships. Do not create PackageEquipment primary type.
  - between:
    - System
    - Equipment
    compact_priority: 3
    rule: 'Tags whose middle segment is PK name an engineering package. Use primary System and subtype
      EngineeringPackage. Do not type bare PK tags as Equipment. Single machines use other tag letters
      (P, E, V, K, ME, G, etc.) as Equipment when the source supports that role.'
  - between:
    - Requirement
    - Document
    rule: An independently identifiable clause/criterion is Requirement; the document containing it remains Document.
  - between:
    - Document
    - ProcurementArtifact
    compact_priority: 2
    rule: 'Named tender-section documents must use a specific Document subtype from Recommended subtypes
      (BidInstructions for ITB / Instructions to Bidders, TenderNotice for NIT, InvitationForBids for IFB,
      BidDataSheet for BDS, ScopeOfWork for SOW, Specification or Datasheet for PRO-TDS / TDS / datasheet
      numbers, and similar). Never set subtype to Document. Prefer one canonical entity per section title;
      do not emit duplicate Document nodes for the same heading.'
  # Entity vs non-entity: definition-based decision criteria for LLM guidance.
  # Do not treat any criterion as an exact-word blacklist. Classify from source
  # context, independent identity, and ontology definitions.
  non_entity_policy:
    independent_entity:
      definition: >-
        Emit an entity only when the span names an independently identifiable
        referent that can stand alone in the domain graph and fits a primary
        type (or Other with typing_reason when none of the 27 specifics fit).
      decision_criteria:
      - The source supports a distinct real-world or document-domain object, not
        merely a value, unit, predicate, or formatting fragment.
      - The referent would remain meaningful if separated from surrounding field
        labels, table headers, or parent phrases.
      - Prefer a specific primary from the closed 28-type set; omit the span
        entirely when it is not an identifiable entity.
    properties_not_nodes:
      definition: >-
        Scalar measurements, quantities, states, revisions, and other attributes
        of an already-identified subject are properties, not independent entities.
      decision_criteria:
      - Prefer metadata.properties (or attribute triplets) on the owning entity
        when ownership is clear from the same sentence, row, or active section.
      - Do not promote ordinary capacity, pressure, temperature, dimension,
        quantity, date, revision, or unit phrases into standalone nodes.
      - Keep the owning entity when it is independently identifiable; only the
        attribute expression is non-entity.
      - If ownership is ambiguous, omit the association rather than invent a node.
    identifiers_not_separate_nodes:
      definition: >-
        An identity code or alias that only re-names an already-extracted entity
        is metadata, not a second entity.
      decision_criteria:
      - Attach the code under metadata.identifiers (or aliases) on the canonical
        entity when source evidence establishes identity equivalence.
      - Do not emit a separate node for an alias-only re-mention of the same code.
      - If the code identifies a different object, extract that object separately;
        never treat child tags as aliases of a parent.
    relations_not_nodes:
      definition: >-
        Relationship predicates and link phrases describe edges between entities;
        they are not entities themselves.
      decision_criteria:
      - Represent supported links as relations or entity-entity triplets with
        grounded endpoints.
      - Do not create nodes whose only content is a predicate word or membership
        phrase without an independently identifiable referent.
    reject_noise:
      definition: >-
        Function words, formatting-only labels, page chrome, and incomplete
        fragments that lack an independently identifiable referent are noise.
      decision_criteria:
      - Omit spans that are purely grammatical glue or layout chrome.
      - Omit generic table headers, page labels, and formatting-only titles when
        they do not name a distinct artefact or asset.
      - Omit incomplete text fragments that cannot be grounded as a referent.
      - Decide from structure and role in the source, not from memorised tokens.
    reject_field_labels:
      definition: >-
        Source field labels and metadata-banner captions that only name a slot
        for a value (key/value or adjacent table cells) are not entities.
      decision_criteria:
      - Omit the label span when it functions as a caption for an adjacent value
        in a banner, row, or key-value layout.
      - Keep the value when that value independently identifies a project,
        document, asset, or other domain object.
      - Do not type bare field labels as Document, DocumentSection, or Other.
      - Decide from layout role and discovered label/value structure, not from
        memorised label phrases.
    reject_generic_words:
      definition: >-
        Bare category words without a distinct named referent are not entities;
        the same wording may be an entity when the document clearly identifies a
        specific object or titled section.
      decision_criteria:
      - Omit unscoped category labels that only group content without naming a
        distinct object.
      - Keep the span when source context gives it independent identity (named
        title, tagged asset, uniquely referenced section, or equivalent evidence).
      - Never apply an exact-word blacklist; generic vocabulary alone is not
        rejection criteria.
    reject_incomplete_headings:
      definition: >-
        Structural outline markers and untitled section scaffolding are not
        entities unless the source also supplies an identifiable document or
        artefact title.
      decision_criteria:
      - Omit part/section/annexure/index scaffolding that carries no artefact
        identity beyond formatting.
      - Keep a heading when it names a specific document, package, system,
        equipment item, or other independently identifiable referent.
    reject_duplicate_identifiers:
      definition: >-
        Re-extraction of an identity code already bound to a canonical entity
        does not create a new entity.
      decision_criteria:
      - Prefer one canonical node per distinct identity; further mentions update
        identifiers, aliases, properties, or evidence on that node.
      - Alias-only repeats of an existing identity code should be omitted as
        separate entities.
    context_sensitive:
      definition: >-
        Some spans are entity-worthy only in context: the same surface may be a
        property, alias, generic grouping label, or a true entity depending on
        surrounding evidence.
      decision_criteria:
      - Classify from the span's role in the local sentence, row, heading, or
        active section, together with ontology definitions.
      - Bare identity tags are entities when they denote a distinct asset; they
        are identifiers-only when they merely alias an already-extracted entity.
      - Grouping labels are entities only when the document treats them as a
        named, independently referenceable object or titled artefact.
    other_is_not_for:
      definition: >-
        Other is only for an independently identifiable referent that fits none
        of the 27 specific primaries after subtype consideration. It is not a
        dump for uncertainty or non-entities.
      decision_criteria:
      - Do not use Other for uncertain labels of an otherwise classifiable entity;
        choose the best specific primary or omit if unsupported.
      - Do not use Other for noise, unattached values or units, incomplete
        fragments, pure aliases/identifiers, or formatting labels.
      - When Other is justified, set typing_reason and review_required; never emit
        empty, Unknown, or Entity filler labels.
  extraction_output_example:
    entities:
    - text: Centrifugal Pump P-101
      label: Equipment
      confidence: 0.98
      metadata:
        kind: entity
        subtype: CentrifugalPump
        identifiers:
        - value: P-101
          role: identity
        aliases: []
        properties:
          rated_capacity:
            value: 500
            unit: m3/h
    relationships:
    - subject: Centrifugal Pump P-101
      predicate: installedAt
      object: Coastal Refinery Complex
      evidence: P-101 is installed at Coastal Refinery Complex
  notes:
  - Illustrative examples do not assert facts about a real source document.
  - 'This is a proposed schema rather than a measured 90-95% recall guarantee. Validate against annotated

    representative documents.'
  - Change the parser/validator if it currently requires a different label vocabulary or metadata shape.
  - 'Primary types are the closed 28-type set (27 specific + Other). Prefer a specific primary; if an

    identifiable entity fits none, assign Other with typing_reason + review. Never leave the primary label

    empty and never invent Entity/Unknown. If the span is not an identifiable entity, omit it.'
identity_resolution:
  require_identity_proof: true
  reject_conflicting_identity_codes: true
  # Alias-only merge candidates need the alias string in entity/document evidence.
  require_alias_source_evidence: true
  # Merge only when labels match or share a type_equivalence_groups bucket.
  require_type_compatibility: true
  merge_identity_codes_despite_type_conflict: false
  merge_exact_name_despite_type_conflict: false
  # Exact identity codes win over empty/Other vs typed spine (prevents duplicate UUIDs).
  link_exact_identity_despite_empty_or_other: true
  prefer_typed_survivor_on_identity_link: true
  # One O(n) identity-code index per resolver batch — avoid per-mention full table scans.
  build_identity_code_index_once: true
  merge_similar_surfaces: true
  # LLM + ner_taxonomy typing only. Optional linguistic cues stay OFF unless an industry
  # pack explicitly enables use_surface_type_cues and populates surface_type_cues.
  use_surface_type_cues: false
  detect_quantity_surfaces: true
  # Export: keep Other / empty-type entities that have identifiers or relation endpoints.
  export_keep_other_with_identifiers: true
  export_keep_relation_endpoints: true
  quantity_count_suffixes:
  - nos
  - no
  - pcs
  - pc
  - units
  - unit
  surface_connector_equivalents:
  - - '&'
    - +
  ambiguous_to_review: true
  allow_semantic_candidate_retrieval: true
  merge_on_embedding_similarity_alone: false
  block_create_on_semantic_candidates_only: false
  review_alias_collisions: true
  allow_fuzzy_candidate_retrieval: true
  # Never merge entities from fuzzy/name similarity alone (identity merge pass respects this).
  merge_on_fuzzy_similarity_alone: false
  fuzzy_min_score: 90
  fuzzy_candidate_top_k: 5
  fuzzy_same_type_only: true
  # Safe type normalization only — do NOT treat PKG/SYS tag tokens as type synonyms.
  # Conflicting identity_merge-role identifiers always block even when aliases match.
  type_equivalence_groups:
  - - System
    - Package
    - Package/System
    - EngineeringPackage
  - - System
    - Subsystem
  - - Document
    - Document/Section
    - DocumentSection
  - - ProcurementArtifact
    - Tender
  - - LegalInstrument
    - Contract
  weak_open_vocab_types:
  - CONCEPT
  - Entity
  - DATE
  - PRODUCT
  - EVENT
  - GPE
  - FACILITY
  - ORG
  - QUANTITY
  - CARDINAL
  - MONEY
  - PERCENT
  # Optional industry pack only — ignored while use_surface_type_cues is false.
  # Do not put corpus entity names here; markers are linguistic type hints, not facts.
  surface_type_cues: []
  reject_noise_surfaces:
  - for
  - and
  - or
  - of
  - the
  - a
  - an
  - to
  - by
  - with
  - as
  - at
  - true
  - in
  - from
  - into
  - via
  - per
  reject_generic_alias_tokens:
  - accessories
  - auxiliaries
  - spares
  - items
  - details
  - general
  - miscellaneous
  organization_suffixes:
  - Ltd
  - Ltd.
  - Limited
  - Pvt Ltd
  - Pvt. Ltd
  - Pvt. Ltd.
  - Private Limited
  - Corporation
  - Corp
  - Corp.
  - Company
  - Inc
  - Inc.
  - LLC
  # Identifier cues only (merge/alias). Entity typing is LLM + YAML
  # disambiguation / compact_prompt pins — do not force type from tag regex.
  identifier_patterns:
  - pattern: '(?i)\b(?P<tag>\d{1,4}-[A-Z]{1,4}-\d{2,6}[A-Z]?(?:/[A-Z0-9]+)*)\b'
    role: identity
    kind: engineering_tag
    confidence: 0.92
  - pattern: '(?i)\b(?:DOC|DWG|DS|PID|PFD|PO|NIT|RFQ|REQ)-[A-Z0-9][A-Z0-9./_-]{1,}\b'
    role: identity
    kind: document_or_procurement_code
    confidence: 0.9
  # Recovery of missing relation endpoints (see main.recover_missing_endpoints).
  # Patterns stay policy-owned — not hardcoded in Python.
  endpoint_recovery:
    enabled: true
    require_verbatim_in_evidence: true
    # Exact identity only — never prefix-merge individual tags into group tags.
    allow_prefix_alias: false
    identifier_kind_primary:
      engineering_tag: Equipment
      document_or_procurement_code: Document
    # One engineering_tag pattern; middle segment → graph_schema.node_catalog key
    # (primary/subtype come from the catalog, not a second regex).
    engineering_tag_middle_node_catalog:
      PK: EngineeringPackage
    # When a predicate uniquely implies the unresolved endpoint's primary.
    predicate_endpoint_primaries:
      controlled by:
        object: ControlLoop
      shut down by:
        object: ControlLoop
    # Unresolved object → literal only when predicate + literal kind + subject role match.
    # Graph builder accepts semantic literals only after recovery sets semantic_literal_validated.
    predicate_literal_object:
      provides:
        category: semantic
        allowed_literal_kinds:
        - deliverable_prose
        allowed_subject_primaries:
        - Organization
      requires deliverable:
        category: semantic
        allowed_literal_kinds:
        - deliverable_prose
        allowed_subject_primaries:
        - Document
        - System
        - Organization
      requiresDeliverable:
        category: semantic
        allowed_literal_kinds:
        - deliverable_prose
        allowed_subject_primaries:
        - Document
        - System
        - Organization
  identifier_roles:
    identity:
      identity_merge: true
      alias_index: true
      expand_as_member: false
    alias:
      identity_merge: false
      alias_index: true
      expand_as_member: false
    member:
      identity_merge: false
      alias_index: false
      expand_as_member: true
    reference:
      identity_merge: false
      alias_index: false
      expand_as_member: false
    unresolved:
      identity_merge: false
      alias_index: false
      expand_as_member: false
hierarchy:
  require_grounded_parent_child_assertion: true
  # Hierarchy self-parents quarantined; identity-merge collapses → merged_identity_self_loop audit.
  # Semantic self-loops are not auto-dropped here — use predicate/YAML rules instead.
  forbid_self_parent: true
  prevent_cycles: true
  allow_multiple_supported_parents: true
  preserve_cross_system_relations: true
  enforce_allowed_parent_child: true
  quarantine_invalid_hierarchy: true
  canonicalize_hierarchy_direction: true
  promote_section_membership: true
  inject_section_context_into_chunks: true
