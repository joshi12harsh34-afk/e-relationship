  section_membership_predicate: sectionContains
  section_path_separators:
  - ' / '
  - ' → '
  - ' > '
  - ' :: '
  - ' | '
  min_section_match_chars: 5
  title_identity_hint_pattern: '\([A-Za-z0-9][A-Za-z0-9._/+-]{2,}\)'

  # Each entry MUST be exactly [ParentPrimary, ChildPrimary]. Never flatten to bare strings.
  # Subtypes (ScopeOfWork / EngineeringPackage / Subsystem) are enforced via
  # predicate_parent_child_subtypes — primaries stay Document/System after taxonomy fold.
  # Intended engineering chain:
  #   Tender → ScopeOfWork → EngineeringPackage → System → [Subsystem] → Equipment → Component
  #   Package → Equipment (direct) | Scope → Equipment (standalone, evidenced)
  # Canonical 28-primary pairs only (normalize legacy labels → primary before enforce).
  allowed_parent_child:
    # --- Engineering / tender scope hierarchy ---
    - [ProcurementArtifact, Document]   # hasScope / hasDocument
    - [Document, System]                # hasPackage → EngineeringPackage (System)
    - [Document, Equipment]             # Scope standalone equipment (evidenced)
    - [Document, Requirement]           # hasRequirement
    - [Document, Document]              # documentContains / sectionContains
    - [System, System]                  # hasSystem / hasSubsystem
    - [System, Equipment]               # Package-direct / System / Subsystem equipment
    - [Equipment, Component]            # hasComponent
    # --- Deliverables (not physical plant containment) ---
    - [Document, Activity]
    - [System, Activity]
    # --- Engineering endpoints ---
    - [Equipment, ConnectionPoint]
    - [System, PipingLine]
    - [System, ProcessStream]
    - [System, ControlLoop]
    - [ControlLoop, Component]
    - [PipingLine, ConnectionPoint]
    - [PipingLine, Component]
    # --- Site / org nesting ---
    - [Facility, System]
    - [Facility, Equipment]
    - [Facility, Facility]
    - [Project, Project]
    - [Organization, Organization]
    - [Component, Component]
    - [Activity, Activity]
    - [Process, Process]

  # Primary-type role gates — spaced + camelCase aliases aligned.
  # Generic contains/includes must NOT connect Document↔Document peers (use documentContains /
  # sectionContains for membership). Document→System/Equipment still allowed via pair list.
  reject_flat_list_sibling_hierarchy: true
  flat_list_sibling_predicates:
