  - table of contents
  - contents
  - index of
  flat_list_min_pipe_cells: 2
  predicate_parent_child_roles:
    contains: &generic_contains_roles
      parent: [System, Facility, Equipment, Component, Organization, Project, Activity, Process, Document, ProcurementArtifact]
      child: [System, Facility, Equipment, Component, Organization, Project, Activity, Process]
    includes: *generic_contains_roles
    documentContains:
      parent: [Document]
      child: [Document]
    sectionContains:
      parent: [Document]
      child: [Document]
    has scope:
      parent: [ProcurementArtifact]
      child: [Document]
    hasScope:
      parent: [ProcurementArtifact]
      child: [Document]
    has package:
      parent: [Document]
