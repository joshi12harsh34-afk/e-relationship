  # Subtype gates: EngineeringPackage / System / Subsystem hierarchy (primaries stay System/Document).
  predicate_parent_child_subtypes:
    has scope: &has_scope_subtypes
      parent: [Tender, RFQ, NIT, InvitationToBid]
      child: [ScopeOfWork]
      allow_unspecified_parent_subtype: true
      allow_unspecified_child_subtype: true
    hasScope: *has_scope_subtypes
    has package: &has_package_subtypes
      parent: [ScopeOfWork]
      child: [EngineeringPackage]
      allow_unspecified_parent_subtype: true
      allow_unspecified_child_subtype: true
    hasPackage: *has_package_subtypes
    has system: &has_system_subtypes
      parent: [EngineeringPackage]
      child_exclude: [EngineeringPackage, Subsystem]
      allow_unspecified_parent_subtype: true
      allow_unspecified_child_subtype: true
    hasSystem: *has_system_subtypes
    has subsystem: &has_subsystem_subtypes
