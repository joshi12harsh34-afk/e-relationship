      direction_window: covering_span
    evidence:
      predicate_cues_any:
      - for project
      - for project of
      - project of
      nearby_recovery:
        enabled: true
        windows:
        - sentence
        - table_row
        - section_block
    candidate_generation:
      enabled: true
      sources:
      - sentence
  connected to:
    category: technical
    aliases:
    - connected_to
    - connectedTo
    endpoints:
      subject_primaries:
      - Equipment
      - Component
      - System
      object_primaries:
      - Equipment
      - Component
      - System
    direction:
      kind: symmetric
      direction_window: between_endpoints
    evidence:
      predicate_cues_any:
      - connected to
      - connects to
      - connected
      nearby_recovery:
        enabled: true
        windows:
        - sentence
        - table_row
# Selective second pass: LLM proposes accept/repair/reject; Python re-checks
# evidence offsets, endpoints, and YAML hierarchy. Never relaxes ontology gates.
quarantine_llm_resolver:
  enabled: true
  max_candidates_per_file: 24
  batch_size: 6
  context_chars: 900
  eligible_reason_codes:
  - evidence_missing
  - evidence_unverified
  - unresolved_subject
  - unresolved_object
  - hierarchy_invalid
  excluded_reason_codes:
  - duplicate_edge
  - self_parent
  - hierarchy_cycle
  hierarchy_repair_predicates_only: true
table_extraction:
  # Repeated page headers/footers/metadata banners: structure + repetition in code;
  # qualitative rules live in prompts/unified_extraction.txt (A6b). These hints only
  # protect tender/spec/commercial tables from being treated as boilerplate.
  boilerplate_detection:
    content_table_hints:
    - type of tender
    - reverse auction
    - design capacity
    - conveying media
    - equipment included
    - service
    - qty
    - quantity
    - material
    - operating parameter
    - scope of work
    - bid document no
    - notice inviting tender
    min_content_rows: 6
    min_content_plain_chars: 500
    max_banner_rows: 4
    max_banner_plain_chars: 400
    min_repetitions: 2
  # Column-role markers are linguistic guidance for structured tables — not entity type maps.
  subject_column_markers:
  - item
  - tag
  - equipment
  - tag no
  - tag no.
  - tag number
  description_column_markers:
  - service
  - description
  - duty
  - scope
  quantity_column_markers:
  - qty
  - quantity
  - q.ty
  - no.
  - nos
  measurement_column_markers:
  - capacity
  - volume
  - temperature
  - pressure
  - flow
  - rate
  - density
  - bulk density
  - real density
  - average density
  - settled bulk density
  - aerated bulk density
  - polymer flow rate
  - conveying mode
  # Split inline label/value phrases inside table cells and mashed HTML text.
  # Structural separators only — not equipment- or document-specific labels.
  inline_kv_separators:
  - ' - '
  - ' – '
  - ' — '
  - ' = '
  - ': '
  - '='
  - ':'
  format_row_groups_for_llm: true
  keep_verbatim_table_in_prompt: true

# Cross-page equipment section ownership for attribute evidence (see main.py).
# Policy flags only. Structural Markdown/HTML parsing is generic in code.
# Domain cues come from identifier_patterns, property_concept_aliases, and
# table_extraction markers — not document-format regex lists.
section_aware_evidence:
  enabled: true
  reuse_identifier_patterns: true
  reuse_property_concept_aliases: true
  reuse_table_column_markers: true
  discover_kv_labels_from_document: true
  # When predicate hits measurement/quantity markers and the object looks
  # numeric/unit-like, require Pint (or bare number) confirmation. Non-numeric
  # attributes keep existing KV/table/YAML evidence rules; ambiguous values
  # fall through to quarantine.
  pint_confirm_measurement_objects: true
  # LLM decides only when deterministic section/tag ownership is ambiguous.
  llm_owner_fallback: true
  llm_owner_fallback_only_when_ambiguous: true
  # Structure-aware table ownership: left/subject column owns right/value cells.
  # Continuation rows inherit the active owner until a new owner, table/section
  # boundary, or ambiguity. No hardcoded tags/names; uses identifier_patterns.
  table_ownership_resolver:
    enabled: true
    prefer_subject_column: true
    accept_unique_row_owner_without_section: true
    inherit_owner_on_continuation_rows: true
    reset_owner_on_section_boundary: true
    max_row_chars: 1200
    max_group_rows: 24
    # Owner evidence stays separate from field/value evidence.
    attach_owner_cell_provenance: true
assertion_classification:
  # Extra LLM assertion-classification stage is optional; marker lists below remain authoritative.
  llm_assertion_stage_optional: true
  preserve_marker_rules_when_llm_disabled: true
  # Scalars attach to owning entity (CanonicalEntity.properties.attributes + Neo4j e.attributes).
  # Do not mint Property / PropertyValue / ListItem domain nodes for ordinary attributes.
  store_scalar_properties_on_entity: true
  mint_property_carrier_nodes: false
  identity_property_markers:
  - name
  - title
  - full name
  - designation
  - designated as
  - labelled as
  - labeled as
  alias_property_markers:
  - alias
  - also known as
  - aka
  - formerly
  - alternate name
  membership_property_markers:
  - included in
  - includes
  - part of
  - belongs to
  - member of
  - contains
  - consists of
  - has scope
  - has package
  - has system
  - has subsystem
  - has equipment
  - has component
  - parent of
  - child of
  reference_property_markers:
  - reference
  - refers to
  - refer to
  - see also
  - according to
  - per document
  - document no
  - requisition
  property_concept_aliases:
    DT: Design Temperature
    DesignTemperature: Design Temperature
    design temp: Design Temperature
    design_temperature: Design Temperature
    DP: Design Pressure
    DesignPressure: Design Pressure
    design_pressure: Design Pressure
    Qty: Quantity
    QTY: Quantity
    qty: Quantity
graph_schema:
  schema_version: '1.0'
  purpose: Unified tender document and engineering scope graph; source-grounded named entities plus literal properties.
  implementation_note: New graph_schema keys require parser, assertion classifier and validator support; do not
    assume legacy YAML loader enforces them.
  primary_type_vocabulary: ner_taxonomy.entity_types
  identifier_rule: Identifiers belong to the referenced entity unless the source independently describes an identifier
    as an entity.
  entity_creation_rule: Create a node only for an independently identifiable source-grounded referent. A template
    label or heading is not sufficient evidence for an instance.
  property_rule: Scalar dates, amounts, quantities, units, descriptive states and identifiers are properties or
    property assertions, not automatic NER nodes.
  source_requirements:
  - verbatim_evidence
  - document_id
  - section_path
  - mention_or_span
  - source_revision_when_available
  required_node_fields:
  - name
  - primary_type
  - subtype
  - source_evidence
  - review_required
  node_catalog:
    Tender:
      primary_type: ProcurementArtifact
      subtypes:
      - Tender
      - RFQ
      - NIT
      - InvitationToBid
      notes: One identified solicitation entity; NIT notice file is only a second Document if separately identified.
    TenderDocumentSet:
      primary_type: Document
      subtype: DocumentRegister
      create_when: Explicitly identified indexed document collection; otherwise virtual grouping only.
    ScopeOfWork:
      primary_type: Document
      subtype: ScopeOfWork
      create_when: Distinct SOW document or explicitly identifiable scope anchor; document section remains Document/DocumentSection
        otherwise. Do not classify PRO-TDS / TDS / datasheet artefacts as ScopeOfWork.
    TechnicalDatasheet:
      primary_type: Document
      subtype: Datasheet
      create_when: 'Identifiable TDS / PRO-TDS / equipment or package datasheet / technical data sheet
        document (e.g. …-PRO-TDS-…-PK-…). Prefer Datasheet; Specification is acceptable when the source
        frames it as a technical specification. Use specifies/describes to the referenced package or
        equipment — not hasPackage.'
    EngineeringPackage:
      primary_type: System
      subtype: EngineeringPackage
    System:
      primary_type: System
      subtype: source-grounded functional system subtype
    Subsystem:
      primary_type: System
      subtype: Subsystem
    Equipment:
      primary_type: Equipment
      subtype: source-grounded equipment class
    Component:
      primary_type: Component
      subtype: source-grounded part/instrument/piping component
    ConnectionPoint:
      primary_type: ConnectionPoint
    PipingLine:
      primary_type: PipingLine
    ProcessStream:
      primary_type: ProcessStream
    ControlLoop:
      primary_type: ControlLoop
    Activity:
      primary_type: Activity
    Requirement:
      primary_type: Requirement
    Standard:
      primary_type: Standard
    Material:
      primary_type: Material
    Organization:
      primary_type: Organization
    Project:
      primary_type: Project
    Facility:
      primary_type: Facility
  tender_document_catalog:
    TenderNotice:
      labels:
      - NIT
      - Notice Inviting Tender
      - Tender Notice
      fields:
      - notice_number
      - title
      - issue_date
      - submission_deadline
      - bid_security
      - issuing_authority_reference
      - project_reference
    InvitationForBids:
      labels:
      - IFB
      - Invitation for Bids
      fields:
      - invitation_number
      - issue_date
      - eligibility_summary
      - closing_date
    BidInstructions:
      labels:
      - ITB
      - Instructions to Bidders
      fields:
      - submission_method
      - bid_validity
      - clarification_process
      - bid_opening_method
    BidDataSheet:
      labels:
      - BDS
      - Bid Data Sheet
      - AITB
      fields:
      - bid_specific_rules
      - prebid_meeting_date
      - bid_currency
      - submission_deadline
      - contact_reference
    ContractConditions:
      labels:
      - GCC
      - General Conditions of Contract
      fields:
      - general_terms
      - payment_terms
      - liability_conditions
      - dispute_resolution
    SpecialConditions:
      labels:
      - SCC
      - Special Conditions of Contract
      fields:
      - special_terms
      - schedule_conditions
      - warranty_conditions
      - liquidated_damages_conditions
    TechnicalConditions:
      labels:
      - TCC
      - Technical Conditions of Contract
      fields:
      - technical_obligations
      - inspection_obligations
      - applicable_codes
    ScopeOfWork:
      labels:
      - SOW
      - Scope of Work
      fields:
      - scope_id
      - scope_description
      - inclusions
      - exclusions
      - battery_limits
      - responsibilities
    ScheduleOfRequirements:
      labels:
      - SOR
      - Schedule of Requirements
      fields:
      - deliverable_schedule
      - required_quantities
      - delivery_location
